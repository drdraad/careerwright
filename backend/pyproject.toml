[project]
name = "nessa"
version = "0.0.0"
description = "Nessa local career planner backend (L0)."
requires-python = ">=3.12,<3.13"
# Exact pins: Sprint 0 qualified this combination (docs/dependencies.md,
# docs/adr/0002-durable-execution.md). Change them only by re-running the spike.
dependencies = [
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "pydantic-ai-slim[openai,dbos]==2.62.0",
    "dbos==3.3.0",
    "cryptography==50.0.2",
    "psycopg[binary]==3.3.6",
    "httpx2==2.16.0",
]

[dependency-groups]
dev = [
    "ruff==0.17.3",
    "mypy==2.4.0",
    "pytest==9.2.0",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nessa"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "spikes"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "RUF", "SIM", "PT", "N"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Tests assert with plain `assert` by design.
"**/test_*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "spikes"]
plugins = ["pydantic.mypy"]
mypy_path = "."
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["spikes"]
pythonpath = ["."]
addopts = "-ra --strict-markers -m 'not integration'"
markers = [
    "integration: needs the spike PostgreSQL 16 container (backend/spikes/durable/compose.yaml)",
]
filterwarnings = ["error"]
