# Throwaway PostgreSQL 16 for the Sprint 0 durability spike (not the L0 dev stack).
# Passwords are generated per run by spikes/durable/stack.py and passed via the environment;
# the stack is torn down with its volume after each run.
name: nessa-spike

services:
  postgres:
    # postgres:16.15-bookworm, multi-arch index digest (linux/arm64 and linux/amd64).
    image: postgres:16.15-bookworm@sha256:d81f7b51697014367236d07ec58b54153fc28f828b72bf247fe5c7487520bcb0
    environment:
      POSTGRES_PASSWORD: ${NESSA_SPIKE_PG_SUPERUSER_PASSWORD:?generated by stack.py}
      NESSA_SPIKE_APP_PASSWORD: ${NESSA_SPIKE_APP_PASSWORD:?generated by stack.py}
      NESSA_SPIKE_DBOS_PASSWORD: ${NESSA_SPIKE_DBOS_PASSWORD:?generated by stack.py}
    ports:
      - "127.0.0.1:${NESSA_SPIKE_PG_PORT:-55432}:5432"
    volumes:
      - nessa-spike-pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP, not the socket: the entrypoint's init-time server listens on the socket only.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 1s
      timeout: 3s
      retries: 30

volumes:
  nessa-spike-pgdata:
    name: nessa-spike-pgdata
